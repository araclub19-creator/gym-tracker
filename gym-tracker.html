<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Tracker">
<meta name="theme-color" content="#f5f5f0">
<title>Gym Tracker · Alejandro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f5f0;
  --surface: #ffffff;
  --surface2: #f0f0eb;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.14);
  --green: #16a34a;
  --green-dim: rgba(22,163,74,0.10);
  --green-mid: rgba(22,163,74,0.20);
  --amber: #d97706;
  --amber-dim: rgba(217,119,6,0.10);
  --text: #111111;
  --text2: #555555;
  --text3: #999999;
  --mono: 'DM Mono', monospace;
  --display: 'Syne', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); overscroll-behavior: none; }

/* Layout */
.app { display: flex; flex-direction: column; height: 100dvh; max-width: 430px; margin: 0 auto; }
.topbar { padding: 18px 20px 0; flex-shrink: 0; }
.topbar-inner { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.app-title { font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.app-title span { color: var(--green); }
.week-pill { display: flex; gap: 4px; background: var(--surface); border-radius: 20px; padding: 4px; border: 1px solid var(--border); }
.week-btn { padding: 4px 10px; border-radius: 16px; font-size: 11px; font-family: var(--mono); color: var(--text2); cursor: pointer; transition: all 0.15s; border: none; background: none; }
.week-btn.active { background: var(--green); color: #fff; font-weight: 500; }

/* Tab bar */
.tabbar { display: flex; padding: 12px 20px 0; gap: 6px; flex-shrink: 0; }
.tabbar-btn { flex: 1; padding: 9px 4px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-family: var(--display); font-size: 12px; font-weight: 600; color: var(--text3); cursor: pointer; transition: all 0.15s; text-align: center; }
.tabbar-btn.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }
.tabbar-btn .tab-letter { font-size: 16px; display: block; }
.tabbar-btn .tab-sub { font-size: 9px; display: block; opacity: 0.7; margin-top: 1px; }

/* Scroll content */
.content { flex: 1; overflow-y: auto; padding: 14px 20px 30px; -webkit-overflow-scrolling: touch; }

/* Warmup */
.info-row { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; font-size: 12px; color: var(--text2); }
.info-row.green { background: var(--green-dim); border-color: rgba(22,163,74,0.2); color: #15803d; }
.info-row.amber { background: var(--amber-dim); border-color: rgba(245,158,11,0.2); color: var(--amber); }
.info-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

/* Exercise card */
.ex-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; transition: border-color 0.2s; }
.ex-card.has-data { border-color: var(--border2); }
.ex-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.ex-name { font-family: var(--display); font-size: 14px; font-weight: 600; line-height: 1.3; color: var(--text); }
.ex-badges { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
.badge { font-size: 10px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border2); color: var(--text3); font-family: var(--mono); }
.pr-tag { font-size: 10px; padding: 3px 8px; border-radius: 6px; background: var(--amber-dim); border: 1px solid rgba(245,158,11,0.3); color: var(--amber); font-family: var(--mono); white-space: nowrap; }

/* Sets grid */
.sets-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 7px; }
.sets-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.set-cell { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 4px 6px; text-align: center; transition: border-color 0.15s; }
.set-cell:focus-within { border-color: var(--green); background: rgba(34,197,94,0.05); }
.set-num { font-size: 9px; color: var(--text3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.set-input { width: 100%; background: none; border: none; outline: none; text-align: center; font-size: 16px; font-family: var(--mono); font-weight: 500; color: var(--text); padding: 0; }
.set-input::placeholder { color: var(--text3); font-size: 14px; }
.set-reps { font-size: 9px; color: var(--text3); margin-top: 3px; }

/* Progress view */
.prog-section-title { font-family: var(--display); font-size: 12px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin: 18px 0 10px; }
.prog-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
.prog-ex-name { font-family: var(--display); font-size: 13px; font-weight: 600; margin-bottom: 12px; }
.prog-bars { display: flex; align-items: flex-end; gap: 8px; height: 80px; }
.prog-bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
.prog-bar-val { font-size: 10px; color: var(--text2); font-family: var(--mono); min-height: 14px; }
.prog-bar { width: 100%; border-radius: 4px 4px 0 0; background: var(--surface2); min-height: 3px; transition: height 0.4s ease; }
.prog-bar.best { background: var(--green); }
.prog-bar.has { background: rgba(34,197,94,0.35); }
.prog-bar-label { font-size: 10px; color: var(--text3); }
.prog-empty { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 13px; line-height: 1.7; }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--green); color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 12px; font-family: var(--mono); font-weight: 500; opacity: 0; transition: all 0.25s; pointer-events: none; z-index: 999; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Scrollbar */
::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="app-title">GYM<span>.</span>LOG</div>
      <div class="week-pill">
        <button class="week-btn active" onclick="setWeek(0)">W1</button>
        <button class="week-btn" onclick="setWeek(1)">W2</button>
        <button class="week-btn" onclick="setWeek(2)">W3</button>
        <button class="week-btn" onclick="setWeek(3)">W4</button>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <button class="tabbar-btn active" onclick="switchTab('A')"><span class="tab-letter">A</span><span class="tab-sub">Pierna</span></button>
    <button class="tabbar-btn" onclick="switchTab('B')"><span class="tab-letter">B</span><span class="tab-sub">Pull</span></button>
    <button class="tabbar-btn" onclick="switchTab('C')"><span class="tab-letter">C</span><span class="tab-sub">Push</span></button>
    <button class="tabbar-btn" onclick="switchTab('D')"><span class="tab-letter">D</span><span class="tab-sub">Torso</span></button>
    <button class="tabbar-btn" onclick="switchTab('P')"><span class="tab-letter">↗</span><span class="tab-sub">Stats</span></button>
  </div>

  <div class="content" id="content"></div>
</div>
<div class="toast" id="toast">Guardado ✓</div>

<script>
const WK = {
  A: {
    label: 'Pierna', day: 'Jueves',
    warmup: '5\' bike + 3×10 rotaciones de brazo',
    cardio: '15\' cinta a 130bpm',
    abs: null,
    exercises: [
      { name: 'Leg press',           sets: 4, rest: "3'",    reps: [10,10,12,12] },
      { name: 'Zancada con peso',    sets: 4, rest: "2'",    reps: ['8×lado','8×lado','10×lado','10×lado'] },
      { name: 'Leg extensión',       sets: 4, rest: "2'30\"",reps: [15,15,20,20] },
      { name: 'Peso muerto rumano',  sets: 4, rest: "3'",    reps: [6,8,10,12] },
      { name: 'Leg curl',            sets: 4, rest: "2'",    reps: [12,12,15,15] },
    ]
  },
  B: {
    label: 'Pull', day: 'Lunes',
    warmup: '5\' bike + 3×10 rotaciones de brazo',
    cardio: '15\' cinta a 130bpm',
    abs: '4×20 abdominales en máquina',
    exercises: [
      { name: 'Remo en polea',          sets: 4, rest: "3'",    reps: [8,8,10,10] },
      { name: 'Jalón al pecho',         sets: 4, rest: "2'30\"",reps: [12,12,15,15] },
      { name: 'Remo en máquina',        sets: 4, rest: "2'",    reps: [10,12,12,15] },
      { name: 'Curl de bíceps en polea',sets: 4, rest: "2'",    reps: [12,15,12,12] },
      { name: 'Curl con máquina',       sets: 4, rest: "2'30\"",reps: [10,10,12,12] },
    ]
  },
  C: {
    label: 'Push', day: 'Martes',
    warmup: '5\' bike + 3×10 rotaciones de brazo',
    cardio: '15\' cinta a 130bpm',
    abs: null,
    exercises: [
      { name: 'Press banca vertical',         sets: 4, rest: "3'",    reps: [8,8,10,10] },
      { name: 'Contractora',                  sets: 4, rest: "2'30\"",reps: [12,12,15,15] },
      { name: 'Press banca inclinado multipow',sets: 4, rest: "2'",   reps: [10,12,12,15] },
      { name: 'Extensión de tríceps en polea',sets: 4, rest: "2'",    reps: [12,15,12,12] },
      { name: 'Press francés barra Z',        sets: 4, rest: "2'30\"",reps: [10,10,12,12] },
    ]
  },
  D: {
    label: 'Torso', day: 'Viernes',
    warmup: '5\' bike + 3×10 rotaciones de brazo',
    cardio: '15\' cinta a 130bpm',
    abs: '5×12 abdominales en máquina',
    exercises: [
      { name: 'Flexiones + remo con barra',       sets: 4, rest: "2'30\"",reps: ['Max+10','Max+12','Max+12','Max+15'] },
      { name: 'Press de hombro con máquina',       sets: 4, rest: "3'",   reps: [8,8,10,12] },
      { name: 'Aperturas laterales con mancuerna', sets: 4, rest: "2'30\"",reps: [12,12,15,15] },
      { name: 'Remo al mentón barra Z',            sets: 4, rest: "2'",   reps: [10,12,12,15] },
    ]
  }
};

let currentTab = 'A';
let currentWeek = 0;
let data = {};

try { const s = localStorage.getItem('gymlog_v2'); if (s) data = JSON.parse(s); } catch(e) {}

function save() {
  try { localStorage.setItem('gymlog_v2', JSON.stringify(data)); } catch(e) {}
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1600);
}

function key(tab, week, ex, set) { return `${tab}_w${week}_e${ex}_s${set}`; }

function getMax(tab, exIdx) {
  let max = 0;
  for (let w = 0; w < 4; w++)
    for (let s = 0; s < WK[tab].exercises[exIdx].sets; s++) {
      const v = parseFloat(data[key(tab,w,exIdx,s)]);
      if (!isNaN(v) && v > max) max = v;
    }
  return max;
}

function isWeekPR(tab, exIdx, week) {
  const ex = WK[tab].exercises[exIdx];
  let wMax = 0;
  for (let s = 0; s < ex.sets; s++) {
    const v = parseFloat(data[key(tab,week,exIdx,s)]);
    if (!isNaN(v) && v > wMax) wMax = v;
  }
  if (!wMax) return false;
  for (let w = 0; w < 4; w++) {
    if (w === week) continue;
    for (let s = 0; s < ex.sets; s++) {
      const v = parseFloat(data[key(tab,w,exIdx,s)]);
      if (!isNaN(v) && v >= wMax) return false;
    }
  }
  return true;
}

function hasCardData(tab, exIdx) {
  const ex = WK[tab].exercises[exIdx];
  for (let s = 0; s < ex.sets; s++)
    if (data[key(tab,currentWeek,exIdx,s)] !== undefined) return true;
  return false;
}

function setWeek(w) {
  currentWeek = w;
  document.querySelectorAll('.week-btn').forEach((b,i) => b.classList.toggle('active', i===w));
  render();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tabbar-btn').forEach((b,i) => {
    const tabs = ['A','B','C','D','P'];
    b.classList.toggle('active', tabs[i] === tab);
  });
  render();
}

function render() {
  if (currentTab === 'P') { renderProgress(); return; }
  const w = WK[currentTab];
  const c = document.getElementById('content');
  let html = '';

  html += `<div class="info-row"><div class="info-dot"></div>${w.warmup}</div>`;

  w.exercises.forEach((ex, ei) => {
    const pr = isWeekPR(currentTab, ei, currentWeek);
    const hd = hasCardData(currentTab, ei);
    html += `<div class="ex-card${hd?' has-data':''}">
      <div class="ex-top">
        <div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-badges">
            <span class="badge">${ex.sets} series</span>
            <span class="badge">Descanso ${ex.rest}</span>
            <span class="badge">×${ex.reps[currentWeek]} reps</span>
          </div>
        </div>
        ${pr ? '<span class="pr-tag">★ PR</span>' : ''}
      </div>
      <div class="sets-label">Peso por serie (kg)</div>
      <div class="sets-grid">`;
    for (let s = 0; s < ex.sets; s++) {
      const k = key(currentTab, currentWeek, ei, s);
      const val = data[k] !== undefined ? data[k] : '';
      html += `<div class="set-cell">
        <div class="set-num">S${s+1}</div>
        <input class="set-input" type="number" inputmode="decimal" placeholder="—" value="${val}"
          onchange="logW('${currentTab}',${currentWeek},${ei},${s},this.value)"
          onfocus="this.select()">
        <div class="set-reps">${ex.reps[currentWeek]} reps</div>
      </div>`;
    }
    html += `</div></div>`;
  });

  if (w.abs) html += `<div class="info-row amber"><div class="info-dot"></div>ABD: ${w.abs}</div>`;
  html += `<div class="info-row green"><div class="info-dot"></div>Cardio: ${w.cardio}</div>`;

  c.innerHTML = html;
}

function logW(tab, week, ei, si, val) {
  const k = key(tab, week, ei, si);
  const n = parseFloat(val);
  if (val === '' || isNaN(n)) delete data[k];
  else data[k] = n;
  save();
  // refresh PR badges without full re-render
  render();
}

function renderProgress() {
  const c = document.getElementById('content');
  let html = '';
  let anyData = false;

  ['A','B','C','D'].forEach(tab => {
    const w = WK[tab];
    let sectionHtml = `<div class="prog-section-title">${tab} · ${w.label}</div>`;
    let sectionHasData = false;

    w.exercises.forEach((ex, ei) => {
      const weekMaxes = [0,1,2,3].map(wk => {
        let mx = 0;
        for (let s = 0; s < ex.sets; s++) {
          const v = parseFloat(data[key(tab,wk,ei,s)]);
          if (!isNaN(v) && v > mx) mx = v;
        }
        return mx;
      });

      if (!weekMaxes.some(v => v > 0)) return;
      sectionHasData = true;
      anyData = true;

      const allMax = Math.max(...weekMaxes);
      const bestWk = weekMaxes.indexOf(allMax);

      sectionHtml += `<div class="prog-card"><div class="prog-ex-name">${ex.name}</div><div class="prog-bars">`;
      weekMaxes.forEach((v, i) => {
        const pct = allMax > 0 ? Math.round((v / allMax) * 70) : 0;
        const cls = i === bestWk ? 'best' : (v > 0 ? 'has' : '');
        sectionHtml += `<div class="prog-bar-wrap">
          <div class="prog-bar-val">${v > 0 ? v+'kg' : ''}</div>
          <div class="prog-bar ${cls}" style="height:${pct}px"></div>
          <div class="prog-bar-label">W${i+1}</div>
        </div>`;
      });
      sectionHtml += `</div></div>`;
    });

    if (sectionHasData) html += sectionHtml;
  });

  if (!anyData) {
    html = `<div class="prog-empty">Registra pesos en tus entrenamientos y aquí verás tu progreso semana a semana.</div>`;
  }

  c.innerHTML = html;
}

render();
</script>
</body>
</html>
